[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-replay-harness"
version = "0.1.0"
description = "Build and replay an agentic request DAG from TensorRT-LLM request traces"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[project.scripts]
agentic-replay = "agentic_replay.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_replay*"]

